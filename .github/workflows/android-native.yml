name: Android native APK

# Builds the native Material 3 app (android-native/, Kotlin + Jetpack Compose) and attaches the signed APK to a release.
# Run it from the Actions tab, or push a tag such as native-v2.0. Uses the same secrets as the Capacitor build.
on:
  workflow_dispatch:
  push:
    tags: ['native-v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('native-build-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK
        working-directory: android-native
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          for v in GOOGLE_SERVICES_JSON KEYSTORE_BASE64 KEYSTORE_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is not set (see android-native/README.md)"; exit 1; }
          done
          # GOOGLE_SERVICES_JSON may be the raw JSON or its base64.
          if [ "$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | head -c1)" = "{" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json \
              || { echo "::error::GOOGLE_SERVICES_JSON is neither JSON nor valid base64"; exit 1; }
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks" \
            || { echo "::error::KEYSTORE_BASE64 is not valid base64"; exit 1; }
          # The Capacitor app's versionCode is its own run number; start well above it so this installs as an update.
          export VERSION_CODE=$((1000 + ${{ github.run_number }}))
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          gradle :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../mailbox-native.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Android native app ${{ env.TAG }}
          body: "versionCode: ${{ github.run_number }} + 1000. Native Material 3 (Kotlin, Jetpack Compose)."
          files: mailbox-native.apk
